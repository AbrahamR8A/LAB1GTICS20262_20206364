<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>OJO</title>
</head>

<body>

<section class="contacto">
    <h2>Registro de Equipo Tecnologico</h2>

    <form method="post" th:action="@{/registrar/guardar}" >
        <div>
            <label for="nombre">Nombre del equipo</label>
            <input name="nombre" type="text" class="form-control" id="nombre"  required>
        </div>

        <div>
            <label for="tipo">Tipo de Equipo</label>
            <input name="tipo" type="text" class="form-control" id="tipo"  required>
        </div>

        <div>
            <label for="codigo">Codígo de Activo</label>
            <input name="codigo" type="text" class="form-control" id="codigo"  required>
        </div>

        <div>
            <label for="fecha">Fecha de Adquisición</label>
            <input name="fecha" type="date" class="form-control" id="fecha"  required>
        </div>

        <button type="submit" class="btn-enviar">Registrar Equipo</button>
    </form>
</section>



</body>
</html>
